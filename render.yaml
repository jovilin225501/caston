services:
  # -------------------------------------------------------------
  # Backend Web Service (Node.js + Express API)
  # -------------------------------------------------------------
  - type: web
    name: campusconnect-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: ADMIN_NAME
        value: Campus Administrator
      - key: ADMIN_EMAIL
        value: admin@campusconnect.edu
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_PASSCODE
        value: CampusAdmin@2026
      # Set your MongoDB Atlas Connection String in the Render Dashboard
      - key: MONGODB_URI
        sync: false
      # Frontend client URL for CORS allowlisting
      - key: CLIENT_URL
        fromStaticSite:
          name: campusconnect-client
          property: url

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: static
    name: campusconnect-client
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      # SPA rewrite rule to route all subpaths to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campusconnect-api
          property: url
          format: ${url}/api
