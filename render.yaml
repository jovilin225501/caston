services:
  # -------------------------------------------------------------
  # Unified MERN Web Service (React SPA Frontend + Express API)
  # -------------------------------------------------------------
  - type: web
    name: campusconnect
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --prefix client && npm install --prefix server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: ADMIN_NAME
        value: Campus Administrator
      - key: ADMIN_EMAIL
        value: admin@campusconnect.edu
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_PASSCODE
        value: CampusAdmin@2026
      # Set your MongoDB Atlas Connection String in the Render Dashboard
      - key: MONGODB_URI
        sync: false
